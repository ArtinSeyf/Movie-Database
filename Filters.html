<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Movies</title>
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="Filters.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">MovieHub</div>
        <nav class="nav-links">
            <a href="Home.html">Home</a>
            <a href="TopRated.html">Top Rateds</a>
            <a href="Filters.html">Filters</a>
            <a href="search.html">Search</a>
        </nav>
    </header>

    <main class="filters-page">
        <section class="page-header">
            <h1>Filter Movies</h1>
            <p>Browse movies by genre, release year, budget, and revenue.</p>
        </section>

        <section class="filters-layout">

            <aside class="filters-sidebar">
                <h2>Filters</h2>

                <div class="filter-group">
                    <label>Genres</label>
                    <div class="checkbox-group">
                        <label><input type="checkbox" name="genres" value="Action"> Action</label>
                        <label><input type="checkbox" name="genres" value="Adventure"> Adventure</label>
                        <label><input type="checkbox" name="genres" value="Comedy"> Comedy</label>
                        <label><input type="checkbox" name="genres" value="Drama"> Drama</label>
                        <label><input type="checkbox" name="genres" value="Sci-Fi"> Sci-Fi</label>
                        <label><input type="checkbox" name="genres" value="Thriller"> Thriller</label>
                        <label><input type="checkbox" name="genres" value="Romance"> Romance</label>
                        <label><input type="checkbox" name="genres" value="Horror"> Horror</label>
                    </div>
                </div>

                <div class="filter-group">
                    <label>Release Year</label>
                    <div class="range-inputs">
                        <input type="number" id="yearMin" placeholder="Min">
                        <input type="number" id="yearMax" placeholder="Max">
                    </div>
                </div>

                <div class="filter-group">
                    <label for="budgetMin">Budget</label>
                    <div class="range-inputs">
                        <input type="number" id="budgetMin" placeholder="Min">
                        <input type="number" id="budgetMax" placeholder="Max">
                    </div>
                </div>

                <div class="filter-group">
                    <label for="revenueMin">Revenue</label>
                    <div class="range-inputs">
                        <input type="number" id="revenueMin" placeholder="Min">
                        <input type="number" id="revenueMax" placeholder="Max">
                    </div>
                </div>

                <div class="filter-buttons">
                    <button id="applyFiltersBtn" type="button">Apply Filters</button>
                    <button id="clearFiltersBtn" type="button" class="clear-btn">Clear All</button>
                </div>
            </aside>

            <section class="results-section">
                <div class="results-header">
                    <h2>Results</h2>
                    <p class="results-subtitle">Results appear here after you apply filters</p>
                </div>

                <div class="movie-grid">
                    <!-- Results will be injected here. No example movies shown by default. -->
                </div>
            </section>

        </section>
    </main>

    <script src="filters.js"></script>
</body>
</html>
