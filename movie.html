<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Details - MovieHub</title>
    <link rel="stylesheet" href="theme.css">
    <style>
        .details-container {
            width: 90%;
            max-width: 1100px;
            margin: 40px auto;
            display: flex;
            gap: 40px;
            background: var(--bg-secondary);
            padding: 30px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
        }
        .poster-section img { width: 300px; border-radius: 8px; }
        .info-section { flex: 1; }
        .movie-title { font-size: 2.5rem; color: var(--accent); margin-bottom: 10px; }
        
        /* Fallback Search Styles */
        #fallbackSearch {
            text-align: center;
            padding: 50px;
            background: var(--bg-secondary);
            margin: 20px;
            border-radius: var(--radius);
        }
        .mini-search-input {
            padding: 10px;
            width: 300px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #000;
            color: white;
        }
        .search-results-list {
            list-style: none;
            padding: 0;
            margin-top: 20px;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }
        .search-results-list li {
            padding: 10px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
        }
        .search-results-list li:hover { color: var(--accent); }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="logo">MovieHub</div>
        <nav class="nav-links">
            <a href="Home.html">Home</a>
            <a href="Filters.html">Filters</a>
            <a href="search.html">Search</a>
        </nav>
    </header>

    <div id="fallbackSearch" style="display: none;">
        <h2>Select a Movie to View Details</h2>
        <p>Type a movie name below to load its information:</p>
        <input type="text" id="manualInput" class="mini-search-input" placeholder="e.g. Inception">
        <ul id="manualResults" class="search-results-list"></ul>
    </div>

    <main class="details-container" id="movieDetails" style="display: none;">
        <div class="poster-section">
            <img src="./imgs/placeholder.png" alt="Movie Poster">
        </div>
        <div class="info-section">
            <h1 id="movieTitle" class="movie-title"></h1>
            <p id="movieOverview" style="line-height: 1.6;"></p>
            <p><b>Release Year:</b> <span id="movieYear"></span></p>
            <p><b>Budget:</b> <span id="movieBudget"></span></p>
        </div>
    </main>

    <script>
        const params = new URLSearchParams(window.location.search);
        const movieId = params.get('id');
        const backendUrl = "http://127.0.0.1:5001"; // Matches your app.py

        if (movieId) {
            loadMovie(movieId);
        } else {
            document.getElementById('fallbackSearch').style.display = 'block';
        }

        function loadMovie(id) {
            fetch(`${backendUrl}/movie/${id}`)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('fallbackSearch').style.display = 'none';
                    document.getElementById('movieDetails').style.display = 'flex';
                    document.getElementById('movieTitle').innerText = data.title;
                    document.getElementById('movieOverview').innerText = data.overview;
                    document.getElementById('movieYear').innerText = data.release_year;
                    document.getElementById('movieBudget').innerText = "$" + data.budget.toLocaleString();
                });
        }

        // Manual search logic just in case teammates' pages don't link correctly
        document.getElementById('manualInput').addEventListener('input', (e) => {
            const q = e.target.value;
            if (q.length < 2) return;
            
            fetch(`${backendUrl}/search?q=${q}`)
                .then(res => res.json())
                .then(data => {
                    const list = document.getElementById('manualResults');
                    list.innerHTML = "";
                    data.forEach(m => {
                        const li = document.createElement('li');
                        li.innerText = `${m.title} (${m.release_year})`;
                        li.onclick = () => loadMovie(m.id);
                        list.appendChild(li);
                    });
                });
        });
    </script>
</body>
</html>
