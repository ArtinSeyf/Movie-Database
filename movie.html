<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Details - MovieHub</title>
    <link rel="stylesheet" href="theme.css">
</head>
<body>
 
    <header class="navbar">
        <div class="logo">MovieHub</div>
        <nav class="nav-links">
            <a href="Home.html">Home</a>
            <a href="TopRated.html">Top Rated</a>
            <a href="Filters.html">Filters</a>
            <a href="search.html">Search</a>
        </nav>
    </header>
 
    <!-- Loading state -->
    <div id="loadingState" style="text-align:center; padding:80px 20px; color: var(--text-secondary);">
        <p>Loading movie...</p>
    </div>
 
    <!-- Error state -->
    <div id="errorState" style="display:none; text-align:center; padding:80px 20px; max-width:500px; margin:0 auto;">
        <h2>Movie not found</h2>
        <p id="errorMsg">We couldn't load this movie.</p>
        <div style="display:flex; gap:12px; justify-content:center; margin-top:24px;">
            <a href="search.html" style="background:var(--accent); color:white; padding:10px 20px; border-radius:8px; text-decoration:none; font-weight:600;">Search Movies</a>
            <a href="Home.html" style="border:1px solid var(--border); color:var(--text-main); padding:10px 20px; border-radius:8px; text-decoration:none; font-weight:600;">Go Home</a>
        </div>
    </div>
 
    <!-- Movie detail -->
    <main id="movieDetail" style="display:none; width:90%; max-width:1100px; margin:40px auto 60px;">
 
        <!-- Title and genres -->
        <div style="padding-bottom:24px; border-bottom:1px solid var(--border); margin-bottom:32px;">
            <h1 id="movieTitle" style="font-size:2.4rem; color:var(--accent); margin-bottom:14px;"></h1>
            <div id="movieGenres" style="display:flex; flex-wrap:wrap; gap:8px;"></div>
        </div>
 
        <!-- Overview -->
        <div style="margin-bottom:32px;">
            <h2 style="font-size:0.85rem; text-transform:uppercase; letter-spacing:0.1em; color:var(--text-secondary); margin-bottom:12px;">Overview</h2>
            <p id="movieOverview" style="color:var(--text-main); line-height:1.8; max-width:800px;"></p>
        </div>
 
        <!-- Stats -->
        <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:16px; margin-bottom:32px;">
            <div class="movie-card">
                <p style="font-size:0.8rem; text-transform:uppercase; letter-spacing:0.08em; margin-bottom:8px;">Release Year</p>
                <span id="movieYear" style="font-size:1.3rem; font-weight:700; color:var(--text-main);">—</span>
            </div>
            <div class="movie-card">
                <p style="font-size:0.8rem; text-transform:uppercase; letter-spacing:0.08em; margin-bottom:8px;">Runtime</p>
                <span id="movieRuntime" style="font-size:1.3rem; font-weight:700; color:var(--text-main);">—</span>
            </div>
            <div class="movie-card">
                <p style="font-size:0.8rem; text-transform:uppercase; letter-spacing:0.08em; margin-bottom:8px;">Budget</p>
                <span id="movieBudget" style="font-size:1.3rem; font-weight:700; color:var(--text-main);">—</span>
            </div>
            <div class="movie-card">
                <p style="font-size:0.8rem; text-transform:uppercase; letter-spacing:0.08em; margin-bottom:8px;">Revenue</p>
                <span id="movieRevenue" style="font-size:1.3rem; font-weight:700; color:var(--text-main);">—</span>
            </div>
        </div>
 
        <!-- Director -->
        <div style="margin-bottom:32px;">
            <h2 style="font-size:0.85rem; text-transform:uppercase; letter-spacing:0.1em; color:var(--text-secondary); margin-bottom:12px;">Director</h2>
            <p id="movieDirector" style="color:var(--text-main); font-size:1.1rem; font-weight:600;">—</p>
        </div>
 
        <!-- Cast -->
        <div>
            <h2 style="font-size:0.85rem; text-transform:uppercase; letter-spacing:0.1em; color:var(--text-secondary); margin-bottom:12px;">Cast</h2>
            <div id="movieCast" style="display:flex; flex-wrap:wrap; gap:10px;"></div>
        </div>
 
    </main>
 
    <!-- Fallback search (no ?id= in URL) -->
    <div id="fallbackSearch" style="display:none; text-align:center; padding:60px 20px; max-width:500px; margin:0 auto;">
        <h2>Find a Movie</h2>
        <p style="margin-bottom:24px;">Search below to find a movie and view its details.</p>
        <input type="text" id="manualInput" class="search-input" placeholder="e.g. Inception, Avatar...">
        <ul id="manualResults" style="list-style:none; padding:0; margin-top:16px; text-align:left; background:var(--bg-secondary); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden;"></ul>
    </div>
 
    <script src="movie.js"></script>
</body>
</html>
