<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Details - MovieHub</title>
    <link rel="stylesheet" href="theme.css">
    <style>
        /* Specific styles for the Movie Details layout */
        .details-container {
            width: 90%;
            max-width: 1100px;
            margin: 40px auto;
            display: flex;
            gap: 40px;
            background: var(--bg-secondary);
            padding: 30px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }

        .poster-section img {
            width: 300px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .info-section {
            flex: 1;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: var(--accent);
            text-decoration: none;
            font-weight: bold;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .movie-title {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: var(--accent);
        }

        .movie-meta {
            color: var(--text-secondary);
            margin-bottom: 20px;
            font-style: italic;
        }

        .overview-text {
            line-height: 1.8;
            margin-bottom: 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            border-top: 1px solid var(--border);
            padding-top: 20px;
        }

        .stat-item b {
            color: var(--accent);
        }

        #loadingMessage {
            text-align: center;
            margin-top: 100px;
            font-size: 1.5rem;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="logo">MovieHub</div>
        <nav class="nav-links">
            <a href="Home.html">Home</a>
            <a href="Filters.html">Filters</a>
            <a href="search.html">Search</a>
        </nav>
    </header>

    <div id="loadingMessage">Loading movie details...</div>

    <main class="details-container" id="movieDetails" style="display: none;">
        <div class="poster-section">
            <img src="./imgs/placeholder.png" alt="Movie Poster" id="moviePoster">
        </div>

        <div class="info-section">
            <a href="search.html" class="back-link">← Back to Search</a>
            <h1 id="movieTitle" class="movie-title"></h1>
            <p id="movieMeta" class="movie-meta"></p>
            <p id="movieOverview" class="overview-text"></p>
            
            <div class="stats-grid">
                <div class="stat-item"><b>Budget:</b> <span id="movieBudget"></span></div>
                <div class="stat-item"><b>Revenue:</b> <span id="movieRevenue"></span></div>
                <div class="stat-item"><b>Runtime:</b> <span id="movieRuntime"></span> mins</div>
                <div class="stat-item"><b>ID:</b> <span id="movieID"></span></div>
            </div>
        </div>
    </main>
